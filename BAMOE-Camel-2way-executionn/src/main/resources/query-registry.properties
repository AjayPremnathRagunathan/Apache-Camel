# =============================================================================
# BAMOE Camel Query Registry - SQL Query Definitions
# =============================================================================


# =============================================================================
# SELECT / FETCH QUERIES
# =============================================================================

# caseLookup - fetches case participant details for active CUS and NCP roles
caseLookup=SELECT csp.PRTCP_ID, cs.CASE_ID, cs.CASE_EXTID, pnm.FIRST_NM, pnm.LAST_NM, csp.ROLE_CD FROM CASE cs JOIN CASE_PARTICIPANT csp ON cs.CASE_ID = csp.CASE_ID JOIN PARTICIPANT_NAME pnm ON csp.PRTCP_ID = pnm.PRTCP_ID WHERE csp.ROLE_CD IN ('CUS', 'NCP') AND csp.STAT_CD = 'ACT' AND cs.CASE_EXTID = ? FETCH FIRST 100 ROWS ONLY

# caseTeam - fetches the currently assigned team for the given case
caseTeam=SELECT cs.CASE_EXTID, cs.CRNT_ASGN_TEAM_ID FROM CASE cs WHERE cs.CASE_EXTID = ?


# =============================================================================
# ID GENERATORS (sequences) - one ? = caseId (dummy). Confirm sequences exist.
# =============================================================================

GCnextIdsNcp=SELECT NEXT VALUE FOR CSE1DV01.ARAGHUNA.GUIDELINE_CALCULATION_SEQ AS GC, NEXT VALUE FOR CSE1DV01.ARAGHUNA.GUIDELINE_CALCULATION_MONTHLY_INCOME_SEQ AS INC, NEXT VALUE FOR CSE1DV01.ARAGHUNA.GUIDELINE_CALCULATION_MONTHLY_DEDUCTION_SEQ AS DED, NEXT VALUE FOR CSE1DV01.ARAGHUNA.GUIDELINE_CALCULATION_TAX_INFORMATION_SEQ AS TAX, NEXT VALUE FOR CSE1DV01.ARAGHUNA.GUIDELINE_CALCULATION_MONTHLY_INCOME_RESULT_SEQ AS RES FROM SYSIBM.SYSDUMMY1 WHERE ? IS NOT NULL

GCnextIdsOp=SELECT NEXT VALUE FOR CSE1DV01.ARAGHUNA.GUIDELINE_CALCULATION_MONTHLY_INCOME_SEQ AS INC, NEXT VALUE FOR CSE1DV01.ARAGHUNA.GUIDELINE_CALCULATION_MONTHLY_DEDUCTION_SEQ AS DED, NEXT VALUE FOR CSE1DV01.ARAGHUNA.GUIDELINE_CALCULATION_TAX_INFORMATION_SEQ AS TAX, NEXT VALUE FOR CSE1DV01.ARAGHUNA.GUIDELINE_CALCULATION_MONTHLY_INCOME_RESULT_SEQ AS RES FROM SYSIBM.SYSDUMMY1 WHERE ? IS NOT NULL


# =============================================================================
# TEST INSERT
# =============================================================================

insertTestLog=INSERT INTO CAMEL_TEST_LOG (CASE_EXTID, FIRST_NM, LAST_NM, ROLE_CD, ACTION_TYPE, CREATED_BY, STATUS_CD, REMARKS) VALUES (?, ?, ?, ?, ?, ?, ?, ?)


# =============================================================================
# EXISTING MONTHLY INCOME RESULT TEST INSERT
# =============================================================================

insertMonthlyIncome=INSERT INTO CSE1DV01.ARAGHUNA.GUIDELINE_CALCULATION_MONTHLY_INCOME_RESULT (GDELN_CALC_MO_INC_RSLT_ID, MO_NET_DISP_INC_AMT, MO_GROSS_INC_AMT, FED_TAX_LIABL_AMT, ST_TAX_LIABL_AMT, ROW_VERS_ID, FICA_AMT, CASDI_AMT, SELF_EMPL_TAX_AMT, MO_TAX_GROSS_INC_AMT, MO_NON_TAX_GROSS_INC_AMT, MO_FED_ADJ_GROSS_INC_AMT, MO_FED_TAX_INC_AMT, ROW_CREAT_USER, ROW_UPDATE_USER, ROW_CREAT_TS, ROW_UPDATE_TS) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)


# =============================================================================
# GUIDELINE_CALCULATION_MONTHLY_INCOME
# ROUND-TRIP: added ERN_INC_AMT, HOURS_PER_WEEK_NUM, YR_TO_DT_AMT, START_DT, END_DT
# (9 cols). save() must supply these 5 in order:
#   ERN_INC_AMT (monthly/hourly amount), HOURS_PER_WEEK_NUM (hourly),
#   YR_TO_DT_AMT (YTD amount), START_DT + END_DT (YTD period).
# =============================================================================

GCinsertMonthlyIncome=INSERT INTO CSE1DV01.ARAGHUNA.GUIDELINE_CALCULATION_MONTHLY_INCOME (GDELN_CALC_MO_INC_ID, SALARY_AMT, ERN_INC_FREQ_CD, MIN_WAGE_CD, ERN_INC_AMT, HOURS_PER_WEEK_NUM, YR_TO_DT_AMT, START_DT, END_DT) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?)


# =============================================================================
# GUIDELINE_CALCULATION
# ROW_CREAT_TS populated by DB2 DEFAULT CURRENT TIMESTAMP.
# TIME_WITH_NCP_SAME_IND and SHOW_MAX_RSLTS_IND are SMALLINT.
# =============================================================================

GCinsertGuidelineCalculation=INSERT INTO CSE1DV01.ARAGHUNA.GUIDELINE_CALCULATION (GDELN_CALC_ID, INC_TAX_YR, STAT_CD, ROW_VERS_ID, RSN_TXT, TIME_WITH_NCP_SAME_IND, SHOW_MAX_RSLTS_IND, RESULT_TYPE) VALUES (?, ?, ?, ?, ?, ?, ?, ?)


# =============================================================================
# CASE_PARTICIPANT_GUIDELINE_CALCULATION  (8 cols incl. deduction link)
# =============================================================================

GCinsertCaseParticipantGuidelineCalculation=INSERT INTO CSE1DV01.ARAGHUNA.CASE_PARTICIPANT_GUIDELINE_CALCULATION (PRIM_NCP_IND, PRTCP_ID, GDELN_CALC_ID, CASE_ID, GDELN_CALC_MO_INC_ID, GDELN_CALC_MO_DEDCT_ID, GDLN_CALC_TAX_INFO_ID, GDELN_CALC_MO_INC_RSLT_ID) VALUES (?, ?, ?, ?, ?, ?, ?, ?)


# =============================================================================
# GUIDELINE_CALCULATION_TAX_INFORMATION
# =============================================================================

GCinsertGuidelineCalculationTaxInformation=INSERT INTO CSE1DV01.ARAGHUNA.GUIDELINE_CALCULATION_TAX_INFORMATION (GDLN_CALC_TAX_INFO_ID, FILE_STAT_CD, NUM_OF_TAX_EXMPT_NUM, CA_FILE_STAT_CD) VALUES (?, ?, ?, ?)


# =============================================================================
# GUIDELINE_CALCULATION_MONTHLY_INCOME_RESULT
# =============================================================================

GCinsertMonthlyIncomeResult=INSERT INTO CSE1DV01.ARAGHUNA.GUIDELINE_CALCULATION_MONTHLY_INCOME_RESULT (GDELN_CALC_MO_INC_RSLT_ID, MO_GROSS_INC_AMT, FICA_AMT, CASDI_AMT, FED_TAX_LIABL_AMT, ST_TAX_LIABL_AMT, MO_NET_DISP_INC_AMT, MO_FED_ADJ_GROSS_INC_AMT, MO_FED_TAX_INC_AMT) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?)


# =============================================================================
# GUIDELINE_CALCULATION_MONTHLY_DEDUCTION
# =============================================================================

GCinsertMonthlyDeduction=INSERT INTO CSE1DV01.ARAGHUNA.GUIDELINE_CALCULATION_MONTHLY_DEDUCTION (GDELN_CALC_MO_DEDCT_ID, CHLD_SUPT_PAID_OTH_RELSHP_AMT, MORTG_INT_AMT) VALUES (?, ?, ?)


# =============================================================================
# EDIT - update an existing calculation instead of adding another one
#
# Save in CSE edits the calculation you opened, it does not create a second row,
# so the edit branch updates these rows and the GDELN_CALC_ID stays the same.
# Each child row is reached through CASE_PARTICIPANT_GUIDELINE_CALCULATION, so
# there is no separate id lookup - just pass the calc id and PRIM_NCP_IND
# (1 = NCP, 0 = OP) as the last two params.
#
# Params are positional, same as the inserts. Order per query:
#   GuidelineCalculation  : taxYear, status, genReason, updatedBy, gdelnCalcId
#   MonthlyIncome         : salary, freq, ernAmt, hours, ytdAmt, ytdStart, ytdEnd, gdelnCalcId, primNcpInd
#   MonthlyDeduction      : chldSuptPaid, mortgInt, gdelnCalcId, primNcpInd
#   TaxInformation        : fedFiling, fedExmpt, caFiling, gdelnCalcId, primNcpInd
#   MonthlyIncomeResult   : gross, fica, casdi, fedTax, stTax, ndi, gdelnCalcId, primNcpInd
#
# ROW_VERS_ID is bumped on the parent row, same as CSE does on its Save.
# START_DT / END_DT are cast because the payload carries the dates as text.
# =============================================================================

GCupdateGuidelineCalculation=UPDATE CSE1DV01.ARAGHUNA.GUIDELINE_CALCULATION SET INC_TAX_YR = ?, STAT_CD = ?, RSN_TXT = ?, ROW_VERS_ID = ROW_VERS_ID + 1, ROW_UPDATE_TS = CURRENT TIMESTAMP, ROW_UPDATE_USER = ? WHERE GDELN_CALC_ID = CAST(? AS BIGINT)

GCupdateMonthlyIncome=UPDATE CSE1DV01.ARAGHUNA.GUIDELINE_CALCULATION_MONTHLY_INCOME SET SALARY_AMT = ?, ERN_INC_FREQ_CD = ?, ERN_INC_AMT = ?, HOURS_PER_WEEK_NUM = ?, YR_TO_DT_AMT = ?, START_DT = CAST(? AS DATE), END_DT = CAST(? AS DATE) WHERE GDELN_CALC_MO_INC_ID = (SELECT GDELN_CALC_MO_INC_ID FROM CSE1DV01.ARAGHUNA.CASE_PARTICIPANT_GUIDELINE_CALCULATION WHERE GDELN_CALC_ID = CAST(? AS BIGINT) AND PRIM_NCP_IND = ?)

GCupdateMonthlyDeduction=UPDATE CSE1DV01.ARAGHUNA.GUIDELINE_CALCULATION_MONTHLY_DEDUCTION SET CHLD_SUPT_PAID_OTH_RELSHP_AMT = ?, MORTG_INT_AMT = ? WHERE GDELN_CALC_MO_DEDCT_ID = (SELECT GDELN_CALC_MO_DEDCT_ID FROM CSE1DV01.ARAGHUNA.CASE_PARTICIPANT_GUIDELINE_CALCULATION WHERE GDELN_CALC_ID = CAST(? AS BIGINT) AND PRIM_NCP_IND = ?)

GCupdateGuidelineCalculationTaxInformation=UPDATE CSE1DV01.ARAGHUNA.GUIDELINE_CALCULATION_TAX_INFORMATION SET FILE_STAT_CD = ?, NUM_OF_TAX_EXMPT_NUM = ?, CA_FILE_STAT_CD = ? WHERE GDLN_CALC_TAX_INFO_ID = (SELECT GDLN_CALC_TAX_INFO_ID FROM CSE1DV01.ARAGHUNA.CASE_PARTICIPANT_GUIDELINE_CALCULATION WHERE GDELN_CALC_ID = CAST(? AS BIGINT) AND PRIM_NCP_IND = ?)

GCupdateMonthlyIncomeResult=UPDATE CSE1DV01.ARAGHUNA.GUIDELINE_CALCULATION_MONTHLY_INCOME_RESULT SET MO_GROSS_INC_AMT = ?, FICA_AMT = ?, CASDI_AMT = ?, FED_TAX_LIABL_AMT = ?, ST_TAX_LIABL_AMT = ?, MO_NET_DISP_INC_AMT = ? WHERE GDELN_CALC_MO_INC_RSLT_ID = (SELECT GDELN_CALC_MO_INC_RSLT_ID FROM CSE1DV01.ARAGHUNA.CASE_PARTICIPANT_GUIDELINE_CALCULATION WHERE GDELN_CALC_ID = CAST(? AS BIGINT) AND PRIM_NCP_IND = ?)


# =============================================================================
# LIST / RETRIEVE / STATUS
# =============================================================================

listGuidelineCalcByCase=SELECT gc.GDELN_CALC_ID, gc.ROW_CREAT_TS, gc.INC_TAX_YR, gc.RESULT_TYPE, gc.STAT_CD, gc.RSN_TXT, gc.ROW_CREAT_USER FROM CSE1DV01.ARAGHUNA.GUIDELINE_CALCULATION gc JOIN CSE1DV01.ARAGHUNA.CASE_PARTICIPANT_GUIDELINE_CALCULATION cp ON cp.GDELN_CALC_ID = gc.GDELN_CALC_ID AND cp.PRIM_NCP_IND = 1 JOIN CASE cs ON cs.CASE_ID = cp.CASE_ID WHERE cs.CASE_EXTID = ? ORDER BY gc.ROW_CREAT_TS DESC

# ROUND-TRIP: added inc.ERN_INC_AMT, inc.HOURS_PER_WEEK_NUM, inc.YR_TO_DT_AMT,
# inc.START_DT, inc.END_DT (raw income for HOURLY/YTD pre-fill). SELECT-only, no
# new params. (TIME_WITH_NCP_PCT intentionally omitted - not on this DB2 schema.)
retrieveGuidelineCalc=SELECT cp.PRIM_NCP_IND, cp.PRTCP_ID, cp.CASE_ID, gc.INC_TAX_YR, gc.STAT_CD, gc.RSN_TXT, inc.SALARY_AMT, inc.ERN_INC_FREQ_CD, inc.ERN_INC_AMT, inc.HOURS_PER_WEEK_NUM, inc.YR_TO_DT_AMT, inc.START_DT, inc.END_DT, ded.CHLD_SUPT_PAID_OTH_RELSHP_AMT, ded.MORTG_INT_AMT, tax.FILE_STAT_CD, tax.NUM_OF_TAX_EXMPT_NUM, tax.CA_FILE_STAT_CD, r.MO_GROSS_INC_AMT, r.FICA_AMT, r.CASDI_AMT, r.FED_TAX_LIABL_AMT, r.ST_TAX_LIABL_AMT, r.MO_NET_DISP_INC_AMT FROM CSE1DV01.ARAGHUNA.CASE_PARTICIPANT_GUIDELINE_CALCULATION cp JOIN CSE1DV01.ARAGHUNA.GUIDELINE_CALCULATION gc ON gc.GDELN_CALC_ID = cp.GDELN_CALC_ID JOIN CSE1DV01.ARAGHUNA.GUIDELINE_CALCULATION_MONTHLY_INCOME inc ON inc.GDELN_CALC_MO_INC_ID = cp.GDELN_CALC_MO_INC_ID LEFT JOIN CSE1DV01.ARAGHUNA.GUIDELINE_CALCULATION_MONTHLY_DEDUCTION ded ON ded.GDELN_CALC_MO_DEDCT_ID = cp.GDELN_CALC_MO_DEDCT_ID JOIN CSE1DV01.ARAGHUNA.GUIDELINE_CALCULATION_TAX_INFORMATION tax ON tax.GDLN_CALC_TAX_INFO_ID = cp.GDLN_CALC_TAX_INFO_ID JOIN CSE1DV01.ARAGHUNA.GUIDELINE_CALCULATION_MONTHLY_INCOME_RESULT r ON r.GDELN_CALC_MO_INC_RSLT_ID = cp.GDELN_CALC_MO_INC_RSLT_ID WHERE cp.GDELN_CALC_ID = CAST(? AS BIGINT) ORDER BY cp.PRIM_NCP_IND DESC

# Not called any more - CSE only moves a calculation to HIS through the Support
# Order flow, so markHistoric was turned into a no-op. Left here in case the
# order side is picked up later.
updateGuidelineCalcStatus=UPDATE CSE1DV01.ARAGHUNA.GUIDELINE_CALCULATION SET STAT_CD = :status, ROW_UPDATE_TS = CURRENT TIMESTAMP, ROW_UPDATE_USER = :updatedBy WHERE GDELN_CALC_ID = :gdelnCalcId
